[workspace]
members = [
    "datadog-aws-core",
    "datadog-aws-core-test-utils",
    "datadog-aws-eventbridge",
    "datadog-aws-lambda",
    "datadog-aws-sns",
    "datadog-aws-sqs",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.91.1"
license = "Apache-2.0"
repository = "https://github.com/DataDog/dd-trace-rs"
authors = ["Datadog Inc. <info@datadoghq.com>"]
# Mark the instrumentation workspace as unpublished until the tag
# publication path is wired up for these crates.
publish = false

[workspace.dependencies]
datadog-aws-core = { version = "0.1.0", path = "datadog-aws-core" }
# By path, so these crates build against the datadog-opentelemetry in the same
# commit. Use its opentelemetry re-exports instead of depending on opentelemetry.
datadog-opentelemetry = { version = "0.6", path = "../datadog-opentelemetry" }
base64 = "0.22.1"
lambda_runtime = "0.13"
serde = "1.0.194"
serde_json = "1.0.140"
# Only for the `testing` feature in tests. Keep it on the line that
# datadog-opentelemetry uses, or the tests fail to compile.
opentelemetry_sdk = { version = "0.33", default-features = false }
tracing = { version = "0.1", default-features = false }
tokio = { version = "1.44.1" }
wiremock = "0.6"
aws-credential-types = "1"
aws-sdk-eventbridge = "1.104.0"
aws-sdk-sns = "1.98.0"
aws-sdk-sqs = "1.97.0"
aws-smithy-runtime-api = { version = "1.11", features = ["client"] }
aws-smithy-types = "1.4"
aws-types = "1.3"
