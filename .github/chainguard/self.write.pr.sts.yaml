issuer: https://token.actions.githubusercontent.com

subject_pattern: "repo:DataDog/dd-trace-rs.*"

claim_pattern:
  ref: "refs/heads/(main|release)"
  ref_protected: "true"
  job_workflow_ref: DataDog/dd-trace-rs/\.github/workflows/release-proposal-dispatch\.yaml@.+

permissions:
  contents: write
  pull_requests: write
