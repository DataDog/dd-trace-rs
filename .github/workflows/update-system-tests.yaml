name: Update system-tests

# Bumps the system-tests pin of test.yaml to the latest commit of system-tests main, and opens (or
# updates) a pull request. PRApprover approves and merges it once CI is green, system-tests included
# (see all-checks.yaml). If CI fails, the pull request stays open for a human to look at.
#
# Run it manually with `gh workflow run update-system-tests.yaml [-f ref=<sha|branch|tag>] [-f dry-run=true]`.

on:
  schedule:
    - cron: "0 5 * * 1" # Every Monday at 05:00 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: system-tests commit, branch or tag to pin (defaults to main)
        required: false
        type: string
        default: main
      dry-run:
        description: Only show the change, don't open a pull request
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

env:
  # Must stay in sync with the PRApprover rule, and with all-checks.yaml
  BRANCH: bot/update-system-tests
  TARGET: .github/workflows/test.yaml

jobs:
  update-system-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Update the system-tests pin
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || 'main' }}
        run: |
          set -euo pipefail

          new_sha="$(gh api "repos/DataDog/system-tests/commits/${REF}" --jq .sha)"
          if [[ ! "$new_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve system-tests ref '${REF}' (got '${new_sha}')"
            exit 1
          fi

          # The pin appears twice in test.yaml: the reusable workflow ref, and its `ref` input.
          # Both must be the same commit, so system-tests runs its own code at that commit.
          mapfile -t current_shas < <(grep -oE 'system-tests\.yml@[0-9a-f]{40}|^\s+ref: [0-9a-f]{40}' "$TARGET" | grep -oE '[0-9a-f]{40}' | sort -u)
          if [[ "${#current_shas[@]}" -ne 1 ]]; then
            echo "::error::Expected one system-tests pin in ${TARGET}, found: ${current_shas[*]:-none}"
            exit 1
          fi
          old_sha="${current_shas[0]}"

          {
            echo "old_sha=${old_sha}"
            echo "new_sha=${new_sha}"
            echo "short_sha=${new_sha:0:8}"
          } >> "$GITHUB_OUTPUT"

          if [[ "$old_sha" == "$new_sha" ]]; then
            echo "system-tests is already pinned to ${new_sha}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sed -i "s/${old_sha}/${new_sha}/g" "$TARGET"

          # Make sure only the two pin lines changed, as expected by the PRApprover rule
          changed_lines="$(git diff --numstat -- "$TARGET" | awk '{print $1 "+" $2 "-"}')"
          if [[ "$changed_lines" != "2+2-" ]] || [[ -n "$(git diff --name-only -- . ":!${TARGET}")" ]]; then
            echo "::error::Unexpected change, expected 2 lines changed in ${TARGET} only"
            git diff
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git --no-pager diff

      - name: Get a GitHub token
        if: steps.update.outputs.changed == 'true' && inputs.dry-run != true
        id: octo-sts
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        with:
          scope: DataDog/dd-trace-rs
          policy: self.update-system-tests.create-pr

      - name: Open or update the pull request
        if: steps.update.outputs.changed == 'true' && inputs.dry-run != true
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          branch: ${{ env.BRANCH }}
          base: main
          sign-commits: true
          delete-branch: true
          add-paths: ${{ env.TARGET }}
          commit-message: "ci(system-tests): update system-tests to ${{ steps.update.outputs.short_sha }}"
          title: "ci(system-tests): update system-tests to ${{ steps.update.outputs.short_sha }}"
          body: |
            Updates the system-tests pin to DataDog/system-tests@${{ steps.update.outputs.new_sha }}.

            [Changes since the previous pin](https://github.com/DataDog/system-tests/compare/${{ steps.update.outputs.old_sha }}...${{ steps.update.outputs.new_sha }})

            This pull request is opened by the [Update system-tests workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}), and is approved and merged by PRApprover once CI is green, system-tests included.

            If system-tests fails, the failure is either a regression of the tracer, or a new test that doesn't pass yet. Fix the tracer or disable the test in the system-tests manifest, or close this pull request: an updated one is opened next week.
