name: Publish

on:
  push:
    tags:
      - '*-v[0-9]+.[0-9]+.[0-9]+*'
env:
  RUST_VERSION: 1.91.1

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write # Enable OIDC, required for crates.io trusted publishing
      contents: read
    steps:
      - name: "Install Rust ${RUST_VERSION}"
        run: rustup install ${RUST_VERSION} && rustup default ${RUST_VERSION}

      - name: "Install nextest"
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: nextest@0.9.96

      - name: "Checkout sources"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2

      - name: "Get tag"
        id: tag
        uses: devops-actions/action-get-tag@fda546b7024dab74c867f31930073a85b5313d3a # 1.1

      # Exchanges the job's OIDC identity for a short-lived crates.io token.
      - name: "Authenticate to crates.io"
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: "Publish"
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PUBLISH_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          ./scripts/publish-crate.sh "${PUBLISH_TAG}"
