[workspace]
members = [
    "datadog-opentelemetry",
    "datadog-opentelemetry/examples/propagator",
    "datadog-opentelemetry/examples/simple_tracing",
    "datadog-telemetry-api",
    "tools",
]

# https://doc.rust-lang.org/cargo/reference/resolver.html#feature-resolver-version-2
resolver = "2"

[workspace.package]
rust-version = "1.91.1"
edition = "2021"
version = "0.6.0"
license = "Apache-2.0"
repository = "https://github.com/DataDog/dd-trace-rs"
readme = "README.md"
description = "Reserved future DataDog package, contact info@datadoghq.com if you think this package name shouldn't be used."
authors = ["Datadog Inc. <info@datadoghq.com>"]

[workspace.dependencies]
# Libdatadog dependencies
libdd-data-pipeline = { version = "14.0.0", features = [
    "stats-obfuscation",
    "telemetry",
], default-features = false }
libdd-trace-utils = { version = "16.0.0", default-features = false }
libdd-trace-model = { version = "1.0.0", default-features = false }
libdd-capabilities-impl = { version = "9.0.0", default-features = false }
libdd-telemetry = { version = "12.0.0", default-features = false }
libdd-common = { version = "10.0.0", default-features = false }
libdd-tinybytes = { version = "1.2.0", default-features = false }
libdd-library-config = { version = "5.0.1", default-features = false }
libdd-otel-thread-ctx = { version = "2.0.1", default-features = false }
libdd-sampling = { version = "10.0.0", default-features = false }
libdd-shared-runtime = { version = "8.0.0", default-features = false }
libdd-remote-config = { version = "9.0.0", default-features = false, features = [
    "client",
] }
libdd-heap-allocator = { package = "libdd-profiling-heap-allocator", version = "1.2.0", default-features = false }
# The opentelemetry versions are pinned temporarily, because 0.33.1 introduces
# an issue that breaks our system tests. This can be relaxed once
# https://github.com/open-telemetry/opentelemetry-rust/issues/3789 is fixed.
opentelemetry_sdk = { version = "=0.33.0", features = [
    "trace",
    "metrics",
    "logs",
], default-features = false }
opentelemetry = { version = "=0.33.0", features = [
    "trace",
    "metrics",
    "logs",
], default-features = false }
opentelemetry-otlp = { version = "=0.33.0", features = [
    "metrics",
    "logs",
], default-features = false }
opentelemetry-semantic-conventions = { version = "=0.33.0", features = [
    "semconv_experimental",
] }
tokio = { version = "1.44.1" }
rand = { version = "0.8", features = ["small_rng"] }

serde = { version = "1.0.194" }
serde_json = { version = "1.0.140" }

hashbrown = { version = "0.15.5" }
foldhash = { version = "0.1.5" }
bumpalo = { version = "3.20", features = ["collections"] }

# Datadog crates
datadog-telemetry-api = { path = "datadog-telemetry-api", version = "0.6.0" }

# Workspace-wide lint levels. Crates opt in with `[lints] workspace = true`.
#
# `unreachable_pub`: a bare `pub` on an item that is not reachable from the crate's public API
# should be `pub(crate)` (or `pub(super)`). Reviewers repeatedly ask for this, and it keeps the
# semver surface of published crates small. CI runs clippy with `-D warnings`, so a violation in an
# opted-in crate fails the build.
#
# ROLLOUT: only crates that are already clean have opted in. `datadog-opentelemetry` is NOT opted
# in yet: it has ~77 violations (more under the `test-utils` / `_unstable_propagation` features,
# where the `core_pub_hack` re-exports in `lib.rs` intentionally widen visibility). Promotion plan:
# narrow those items to `pub(crate)`, add scoped `#[allow(unreachable_pub)]` for the feature-gated
# re-exports in `lib.rs`, then add `[lints] workspace = true` to its Cargo.toml.
# Do not also enable `clippy::redundant_pub_crate`: it directly contradicts this lint.
[workspace.lints.rust]
unreachable_pub = "warn"

[profile.dev]
debug = 2 # full debug info

[profile.bench]
codegen-units = 1
debug = false
incremental = false
opt-level = 3

[workspace.metadata.release]
shared-version = true
publish = false
tag = false
push = false
